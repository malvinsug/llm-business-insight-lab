[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-business-insight-lab"
version = "0.1.0"
description = "High-Reliability BI Framework: Dual-Agent Architecture for KPI-Driven Business Insights via SymCoT & NoCoT Prompting Strategies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Engineer", email = "malvin@tum.de"},
]

dependencies = [
    # Core ML/Data Stack
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    
    # LLM Frameworks: PydanticAI + LangGraph for Agentic Systems
    "pydantic-ai>=0.1.0",
    "pydantic>=2.0.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    
    # LLM Client APIs
    "openai>=1.0.0",
    "anthropic>=0.10.0",
    
    # Optimal Transport for Wasserstein Distance
    "pot>=0.9.0",  # Python Optimal Transport
    
    # Embeddings & NLP
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    
    # Fact-Checking & Evaluation
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    
    # Logging & Instrumentation
    "loguru>=0.7.0",
    "python-json-logger>=2.0.0",
    
    # Configuration Management
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    
    # Data Export & Serialization
    "pyarrow>=12.0.0",
    "polars>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
